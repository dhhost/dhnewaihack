<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>
      𖣘 DH VIP 𝐇𝐀𝐂𝐊 𖣘
    </title>
    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" async="">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js" async="">
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      * {
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            user-select: none !important;
            box-sizing: border-box;
            touch-action: none;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif;
        }

        iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
        }

        :root {
            --pro-red: #FFD700;
            --pro-cyan: #00FF00;
            --pro-gold: White;
            --pro-purple: #FFFF00;
            --bg-dark: #87CEEB;
        }

        /* QUANTUM HUD V3 - COMPACT SCALING */
        #core {
            --hud: #00f7ff;
            --hud2: #7c3cff;
            --danger: #ff1744;
            --success: #00ff88;

            position: fixed;
            right: 15px;
            bottom: 60px;
            width: 175px;
            z-index: 99999;
            cursor: move;
            isolation: isolate;
            filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.85));
            animation: coreFloat 3.5s ease-in-out infinite;
            transform-origin: center;
            perspective: 1000px;
        }

        @keyframes coreFloat {
            0%, 100% {
                transform: translateY(0) rotateX(0deg);
            }
            50% {
                transform: translateY(-5px) rotateX(3deg);
            }
        }

        #core::before,
        #core::after {
            content: &#34;&#34;;
            position: absolute;
            pointer-events: none;
            z-index: -5;
            border-radius: 50%;
        }

        #core::before {
            inset: -20px;
            background: radial-gradient(circle, rgba(0, 255, 255, .15) 0%, rgba(124, 60, 255, .05) 50%, transparent 70%);
            filter: blur(12px);
            animation: hudAura 2.5s ease-in-out infinite;
        }

        #core::after {
            inset: -10px;
            border: 1px solid rgba(0, 255, 255, .16);
            box-shadow: 0 0 14px rgba(0, 255, 255, .12), inset 0 0 14px rgba(0, 255, 255, .06);
            animation: outerRing 4s linear infinite;
        }

        @keyframes hudAura {
            0%, 100% {
                transform: scale(.9);
                opacity: .35;
            }
            50% {
                transform: scale(1.1);
                opacity: 1;
            }
        }

        @keyframes outerRing {
            from { transform: rotate(0deg) scale(.96); }
            to { transform: rotate(360deg) scale(1.04); }
        }

        #core .stage::after {
            content: &#34;&#34;;
            position: absolute;
            width: 165px;
            height: 165px;
            border-radius: 50%;
            border: 1px solid rgba(0, 247, 255, .18);
            box-shadow: 0 0 12px rgba(0, 247, 255, .12), inset 0 0 12px rgba(0, 247, 255, .08);
            animation: quantumRing 8s linear infinite reverse;
            pointer-events: none;
        }

        @keyframes quantumRing {
            from { transform: rotateX(65deg) rotateZ(0deg); }
            to { transform: rotateX(65deg) rotateZ(360deg); }
        }

        #core .stage {
            overflow: visible;
        }

        #core .stage .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            border-radius: 50%;
            background: var(--hud);
            box-shadow: 0 0 6px var(--hud);
            pointer-events: none;
            animation: particleFloat var(--duration) linear infinite;
            opacity: var(--opacity);
        }

        @keyframes particleFloat {
            0% {
                transform: translate3d(var(--x), 60px, 0) scale(.3);
                opacity: 0;
            }
            15%, 80% { opacity: var(--opacity); }
            100% {
                transform: translate3d(calc(var(--x) + var(--drift)), -70px, 0) scale(1);
                opacity: 0;
            }
        }

        #core .stage::before {
            content: &#34;&#34;;
            position: absolute;
            inset: 5px;
            background: linear-gradient(rgba(0, 255, 255, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 255, .035) 1px, transparent 1px);
            background-size: 10px 10px;
            mask-image: radial-gradient(circle, black 15%, transparent 72%);
            -webkit-mask-image: radial-gradient(circle, black 15%, transparent 72%);
            pointer-events: none;
            animation: gridMove 5s linear infinite;
        }

        @keyframes gridMove {
            from { background-position: 0 0; }
            to { background-position: 20px 20px; }
        }

        #timerPill {
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(180deg, rgba(0, 20, 25, .98), rgba(0, 0, 0, .98));
            color: #fff;
            border: 1.5px solid var(--pro-cyan);
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 10px;
            box-shadow: 0 0 12px var(--pro-cyan), inset 0 0 6px var(--pro-cyan);
            z-index: 200;
            min-width: 100px;
            text-align: center;
            letter-spacing: 1px;
            font-family: &#34;Courier New&#34;, monospace;
            text-shadow: 0 0 4px currentColor;
            overflow: hidden;
            white-space: nowrap;
        }

        #timerPill::before {
            content: &#34;&#34;;
            position: absolute;
            width: 30px;
            height: 100%;
            top: 0;
            left: -40px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .7), transparent);
            transform: skewX(-20deg);
            animation: timerShine 2s linear infinite;
        }

        @keyframes timerShine {
            from { left: -40px; }
            to { left: 130%; }
        }

        #panel {
            display: none;
        }

        .stage {
            position: relative;
            height: 150px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .orbit-container {
            position: absolute;
            width: 130px;
            height: 130px;
            animation: rotateRGB 6s linear infinite, orbitPulse 1.8s ease-in-out infinite;
            will-change: transform;
        }

        @keyframes rotateRGB {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes orbitPulse {
            0%, 100% { filter: drop-shadow(0 0 4px rgba(0, 255, 255, .25)); }
            50% { filter: drop-shadow(0 0 14px rgba(0, 255, 255, .85)); }
        }

        .fireball {
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 12px currentColor, 0 0 24px currentColor;
            border: 1.5px solid #fff;
            animation: energyNode 1s ease-in-out infinite alternate;
        }

        .fireball::before {
            content: &#34;&#34;;
            position: absolute;
            inset: -5px;
            border: 1px solid currentColor;
            border-radius: 50%;
            opacity: .35;
            animation: nodeRing 1.3s linear infinite;
        }

        .fireball::after {
            content: &#39;&#39;;
            position: absolute;
            top: 50%;
            left: 50%;
            width: 35px;
            height: 10px;
            background: linear-gradient(to left, currentColor, transparent);
            transform: translateY(-50%) rotate(180deg);
            transform-origin: left center;
            border-radius: 50%;
            opacity: 0.8;
            box-shadow: 0 0 8px currentColor;
        }

        @keyframes energyNode {
            from {
                transform: scale(.8);
                filter: brightness(.8);
            }
            to {
                transform: scale(1.2);
                filter: brightness(1.7);
            }
        }

        @keyframes nodeRing {
            from {
                transform: scale(.65);
                opacity: .8;
            }
            to {
                transform: scale(1.7);
                opacity: 0;
            }
        }

        .triContainer {
            position: relative;
            width: 105px;
            height: 95px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: holoFloat 2.8s ease-in-out infinite;
        }

        .triContainer .crosshair {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
            background: linear-gradient(90deg, transparent 49.5%, rgba(0, 247, 255, .18) 50%, transparent 50.5%),
                linear-gradient(0deg, transparent 49.5%, rgba(0, 247, 255, .18) 50%, transparent 50.5%);
            animation: crosshairSpin 15s linear infinite;
        }

        .crosshair::before,
        .crosshair::after {
            content: &#34;&#34;;
            position: absolute;
            inset: 12px;
            border: 1px dashed rgba(0, 247, 255, .25);
            border-radius: 50%;
        }

        .crosshair::after {
            inset: 32px;
            border-style: solid;
            border-color: rgba(0, 247, 255, .3);
        }

        @keyframes crosshairSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        .hud-corners {
            position: absolute;
            inset: -5px;
            pointer-events: none;
            z-index: 30;
        }

        .hud-corners span {
            position: absolute;
            width: 12px;
            height: 12px;
            border-color: var(--hud);
            border-style: solid;
            filter: drop-shadow(0 0 3px var(--hud));
        }

        .hud-corners .tl { top: 0; left: 0; border-width: 2px 0 0 2px; }
        .hud-corners .tr { top: 0; right: 0; border-width: 2px 2px 0 0; }
        .hud-corners .bl { bottom: 0; left: 0; border-width: 0 0 2px 2px; }
        .hud-corners .br { bottom: 0; right: 0; border-width: 0 2px 2px 0; }

        .triContainer::before {
            content: &#34;&#34;;
            position: absolute;
            width: 120px;
            height: 2px;
            left: -8px;
            top: 50%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, .9), transparent);
            box-shadow: 0 0 6px #00ffff, 0 0 14px rgba(0, 255, 255, .7);
            z-index: 20;
            pointer-events: none;
            animation: scanner 2.2s ease-in-out infinite;
        }

        @keyframes scanner {
            0% { transform: translateY(-45px); opacity: 0; }
            15%, 50%, 85% { opacity: 1; }
            100% { transform: translateY(45px); opacity: 0; }
        }

        .triContainer::after {
            content: &#34;◈  ◇  ◈  ◇  ◈&#34;;
            position: absolute;
            width: 140px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(0, 255, 255, .35);
            font-size: 6.5px;
            letter-spacing: 3px;
            border: 1px dashed rgba(0, 255, 255, .25);
            border-radius: 50%;
            animation: hudRotate 12s linear infinite;
            pointer-events: none;
        }

        @keyframes hudRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes holoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .triSVG {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            animation: triangleGlow 1.8s ease-in-out infinite alternate;
        }

        @keyframes triangleGlow {
            from {
                opacity: .72;
                filter: drop-shadow(0 0 5px rgba(0, 247, 255, .4));
            }
            to {
                opacity: 1;
                filter: drop-shadow(0 0 16px rgba(0, 247, 255, .9));
            }
        }

        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding-top: 4px;
            background: radial-gradient(circle at 50% 35%, rgba(0, 255, 255, .10), rgba(0, 0, 0, .92) 65%);
            border-radius: 14px;
            width: 85px;
            height: 85px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1.5px solid var(--pro-cyan);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            animation: corePulse 2.5s ease-in-out infinite;
            overflow: hidden;
        }

        .content::before {
            content: &#34;&#34;;
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .025) 0px, rgba(255, 255, 255, .025) 1px, transparent 1px, transparent 4px);
            pointer-events: none;
            z-index: 25;
            mix-blend-mode: screen;
            opacity: .7;
        }

        .content::after {
            content: &#34;&#34;;
            position: absolute;
            width: 180%;
            height: 35%;
            left: -40%;
            top: -20%;
            background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, .10) 50%, transparent 65%);
            transform: rotate(-12deg);
            animation: reflectionSweep 4s ease-in-out infinite;
            pointer-events: none;
            z-index: 26;
        }

        @keyframes reflectionSweep {
            0%, 20% { transform: translateX(-40%) rotate(-12deg); }
            70%, 100% { transform: translateX(50%) rotate(-12deg); }
        }

        @keyframes corePulse {
            0%, 100% { box-shadow: inset 0 0 12px rgba(0, 255, 255, .12), 0 0 10px rgba(0, 0, 0, 1); }
            50% { box-shadow: inset 0 0 20px rgba(0, 255, 255, .28), 0 0 18px rgba(0, 255, 255, .16); }
        }

        .brand-tag {
            font-size: 7px;
            color: var(--pro-gold);
            font-weight: 900;
            margin-bottom: 2px;
            text-shadow: 0 0 4px var(--pro-gold);
            text-transform: uppercase;
        }

        .pred-label {
            font-size: 8px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 1.2px;
            opacity: 0.9;
        }

        .bs {
            font-size: 14px;
            font-weight: 1000;
            line-height: 1;
            margin: 3px 0;
            display: block;
            position: relative;
            animation: resultFloat 1.6s ease-in-out infinite, resultGlow 1s ease-in-out infinite alternate;
        }

        .ball-icon {
            width: 20px;
            height: 20px;
            object-fit: contain;
            vertical-align: middle;
            margin-top: 2px;
            filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.6));
        }

        @keyframes resultFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-2px) scale(1.06); }
        }

        @keyframes resultGlow {
            from { filter: drop-shadow(0 0 4px currentColor); }
            to { filter: drop-shadow(0 0 12px currentColor); }
        }

        .big {
            color: #00ff6a !important;
            text-shadow: 0 0 8px #00ff6a, 0 0 20px #00ff6a !important;
        }

        .small {
            color: #ff1744 !important;
            text-shadow: 0 0 8px #ff1744, 0 0 20px #ff1744 !important;
        }

        .signalFlash {
            animation: signalFlash .55s ease-out !important;
        }

        @keyframes signalFlash {
            0% { transform: scale(.55); filter: brightness(2.5); }
            45% { transform: scale(1.15); filter: brightness(1.8); }
            100% { transform: scale(1); filter: brightness(1); }
        }

        /* =========================================================
           COMPACT &amp; SLEEK 3D NEON RAINBOW RGB LOGIN CARD
        ========================================================= */

        @keyframes rotateGradient {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #login {
            padding: 14px 12px 12px 12px;
            border-radius: 16px;
            background: rgba(8, 12, 22, 0.88);
            position: relative;
            overflow: hidden;
            text-align: center;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.9),
                        inset 0 1px 1px rgba(255, 255, 255, 0.15),
                        inset 0 -1px 1px rgba(0, 0, 0, 0.8);
            transform-style: preserve-3d;
            transition: all 0.3s ease;
        }

        /* Animated Compact 3D Rainbow Tube Border */
        #login::before {
            content: &#39;&#39;;
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                from 0deg,
                #ff0055, #ff7300, #fffb00, #00ff66, #00ffff, #0077ff, #7a00ff, #ff00c8, #ff0055
            );
            animation: rotateGradient 4s linear infinite;
            z-index: -2;
        }

        /* Inner Glass Card Layer */
        #login::after {
            content: &#39;&#39;;
            position: absolute;
            inset: 1.5px;
            background: radial-gradient(circle at 50% 0%, rgba(18, 22, 38, 0.96), rgba(5, 7, 14, 0.98));
            border-radius: 14.5px;
            z-index: -1;
            box-shadow: inset 0 0 12px rgba(0, 255, 255, 0.06);
        }

        /* 3D Cyber Shield Icon (Compact) */
        .login-header-icon {
            width: 32px;
            height: 32px;
            margin: 0 auto 6px auto;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.25), rgba(0, 0, 0, 0.85));
            border: 1.2px solid rgba(0, 255, 255, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00ffff;
            font-size: 13px;
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.4), inset 0 0 8px rgba(0, 255, 255, 0.3);
            animation: iconPulse 2s ease-in-out infinite alternate;
        }

        @keyframes iconPulse {
            0% { transform: translateZ(8px) scale(0.95); box-shadow: 0 0 8px rgba(0, 255, 255, 0.3); }
            100% { transform: translateZ(12px) scale(1.05); box-shadow: 0 0 16px rgba(0, 255, 255, 0.8), 0 0 24px rgba(122, 0, 255, 0.6); }
        }

        .login-title {
            font-size: 11.5px;
            margin-bottom: 9px;
            font-weight: 900;
            letter-spacing: 1.2px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.8), 0 0 16px rgba(255, 0, 200, 0.5);
            transform: translateZ(8px);
        }

        /* Input Field Styling */
        .input-box-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 8px;
            transform: translateZ(10px);
        }

        .input-box-wrapper i {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(0, 255, 255, 0.7);
            font-size: 10px;
            z-index: 2;
            transition: all 0.3s ease;
        }

        .inp {
            width: 100%;
            height: 31px;
            background: rgba(10, 14, 26, 0.85);
            border: 1.2px solid rgba(0, 255, 255, 0.3);
            border-radius: 8px;
            color: #fff;
            text-align: center;
            padding-left: 24px;
            padding-right: 10px;
            font-weight: bold;
            font-size: 10px;
            outline: none;
            letter-spacing: 1px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.8), 0 0 6px rgba(0, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .inp:focus {
            border-color: #00ffcc;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.9), 0 0 12px rgba(0, 255, 204, 0.6);
            background: rgba(12, 18, 35, 0.95);
        }

        .inp:focus + i {
            color: #00ffcc;
            text-shadow: 0 0 6px #00ffcc;
        }

        /* 3D Action Buttons */
        .btn {
            width: 100%;
            height: 31px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #00f0ff 0%, #7000ff 50%, #ff007b 100%);
            background-size: 200% 200%;
            color: #fff;
            font-weight: 900;
            font-size: 10px;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(112, 0, 255, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.4);
            position: relative;
            overflow: hidden;
            animation: gradientShift 3s ease infinite;
            transition: all 0.2s ease;
            margin-bottom: 7px;
            transform: translateZ(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .btn::before {
            content: &#34;&#34;;
            position: absolute;
            top: 0;
            left: -120%;
            width: 70%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
            transform: skewX(-25deg);
            animation: buttonSweep 2.5s linear infinite;
        }

        @keyframes buttonSweep {
            0% { left: -120%; }
            50%, 100% { left: 140%; }
        }

        .btn:hover {
            transform: translateZ(15px) translateY(-1px);
            box-shadow: 0 6px 16px rgba(0, 240, 255, 0.6);
        }

        .btn:active {
            transform: translateZ(8px) translateY(1px);
        }

        /* Telegram Button */
        .telegram-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            width: 100%;
            height: 31px;
            border-radius: 8px;
            background: linear-gradient(135deg, #0088cc 0%, #00d2ff 100%);
            color: #fff;
            font-weight: 900;
            font-size: 10px;
            letter-spacing: 1px;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(0, 136, 204, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.4);
            transition: all 0.2s ease;
            transform: translateZ(12px);
        }

        .telegram-btn:hover {
            transform: translateZ(15px) translateY(-1px);
            box-shadow: 0 6px 18px rgba(0, 210, 255, 0.7);
        }

        .telegram-btn:active {
            transform: translateZ(8px) translateY(1px);
        }

        #dragShield {
            position: fixed;
            inset: 0;
            z-index: 99998;
            display: none;
            background: transparent;
            touch-action: none;
        }

        #dragShield.on {
            display: block;
        }

        #core.dragging {
            cursor: grabbing;
            filter: none !important;
        }

        #core.dragging .content {
            -webkit-backdrop-filter: none !important;
            backdrop-filter: none !important;
        }

        #core.dragging .particle,
        #core.dragging .orbit-container,
        #core.dragging .fireball,
        #core.dragging .crosshair,
        #core.dragging .triSVG,
        #core.dragging .content,
        #core.dragging .content::after,
        #core.dragging .stage::before,
        #core.dragging .stage::after,
        #core.dragging .triContainer::before,
        #core.dragging .triContainer::after {
            animation-play-state: paused !important;

    <script>
      document.addEventListener("DOMContentLoaded", () => {

        const BALL_IMAGES = {
            0: 'https://i.postimg.cc/Wzrp0gRV/ball-0-053d2b99.png',

        class Wingo30S {
            constructor() {
                this.h = [];
                this.step = 0;
                this.pending = null;
                this.lossStreak = 0;
                this.winStreak = 0;
                this._prevPred = null;
                this._prevTwo = [];
            }

            _norm(v) {
                if (typeof v === 'number' && Number.isInteger(v) && v >= 0 && v <= 9)
                    return v >= 5 ? 1 : 0;
                if (typeof v === 'string') {
                    const t = v.trim().toUpperCase();
                    if (t === 'BIG' || t === 'B') return 1;
                    if (t === 'SMALL' || t === 'S') return 0;
                    if (/^[0-9]$/.test(t)) return +t >= 5 ? 1 : 0;
                }
                return null;
            }

            _streakLen(s) {
                if (!s.length) return 0;
                const last = s[s.length - 1];
                let n = 1;
                for (let i = s.length - 2; i >= 0 && s[i] === last; i--) n++;
                return n;
            }

            _markov(s, order) {
                const n = s.length;
                if (n < order + 3) return null;
                const pat = s.slice(n - order);
                let c1 = 0, c0 = 0;
                for (let i = order; i < n; i++) {
                    let ok = true;
                    for (let j = 0; j < order; j++)
                        if (s[i - order + j] !== pat[j]) {
                            ok = false;
                            break;
                        }
                    if (ok) s[i] ? c1++ : c0++;
                }
                const tot = c1 + c0;
                if (tot < 2) return null;
                const p = (c1 + 1) / (tot + 2);
                return (p - .5) * 2 * (tot / (tot + 4));
            }

            _freq(s, n) {
                const w = s.slice(-n);
                if (!w.length) return 0;
                return ((w.reduce((a, b) => a + b, 0) / w.length) - .5) * 2;
            }

            _flipRate(s, n) {
                const w = s.slice(-n);
                if (w.length < 3) return .5;
                let f = 0;
                for (let i = 1; i < w.length; i++)
                    if (w[i] !== w[i - 1]) f++;
                return f / (w.length - 1);
            }

            predict() {
                const s = this.h;
                
                // Device-specific uniqueness seed (ensures different users get randomized distinct variations)
                if (!window.__fxDeviceSeed) {
                    let savedSeed = localStorage.getItem('fx_device_seed');
                    if (!savedSeed) {
                        savedSeed = Math.random().toString(36.2) + Date.now().toString(36);
                        localStorage.setItem('fx_device_seed', savedSeed);
                    }
                    let seedNum = 0;
                    for(let i=0; i<savedSeed.length; i++) {
                        seedNum = ((seedNum << 5) - seedNum) + savedSeed.charCodeAt(i);
                        seedNum |= 0;
                    }
                    window.__fxDeviceSeed = (Math.abs(seedNum) % 1000) / 10000; // small unique offset
                }
                if (this.lossStreak >= 2 && this._prevPred !== null) {
                    let targetBit = 1 - (this._prevPred === 'BIG' ? 1 : 0);

                    if (this.lossStreak >= 3 && this._prevTwo.length === 2) {
                        if (this._prevTwo[0] === this._prevTwo[1]) {
                            targetBit = 1 - this._prevTwo[1];
                        } else {
                            if (s.length) targetBit = 1 - s[s.length - 1];
                        }
                    }

                    if (this.lossStreak >= 4 && s.length >= 3) {
                        const recentActual = s.slice(-3);
                        const sum = recentActual.reduce((a, b) => a + b, 0);
                        targetBit = sum >= 2 ? 1 : 0;
                    }

                    const signal = targetBit ? 'BIG' : 'SMALL';
                    this.pending = { signal, step: this.step, forced: this.lossStreak };
                    return { signal, step: this.step, forced: true };
                }

                if (s.length < 4) {
                    let v = !s.length ? (Math.random() < .5 ? 1 : 0) : (Math.random() < .5 ? s[s.length - 1] : 1 - s[s.length - 1]);
                    const signal = v ? 'BIG' : 'SMALL';
                    this.pending = { signal, step: this.step };
                    return { signal, step: this.step };
                }

                const last = s[s.length - 1];
                const strk = this._streakLen(s);
                const m1 = this._markov(s, 1);
                const m2 = this._markov(s, 2);
                const fq = this._freq(s, 15);
                const flip = this._flipRate(s, 20);

                let score = 0, wsum = 0;
                if (m1 !== null) { score += m1 * 0.30; wsum += 0.30; }
                if (m2 !== null) { score += m2 * 0.22; wsum += 0.22; }
                score += (-fq) * 0.10; wsum += 0.10;

                if (strk >= 3) {
                    const dir = last === 1 ? -1 : 1;
                    score += dir * 0.35 * Math.min((strk - 2) / 4, 1);
                    wsum += 0.35;
                }

                if (flip > 0.62) { score += (last === 1 ? -1 : 1) * 0.15; wsum += 0.15; }
                else if (flip < 0.38) { score += (last === 1 ? 1 : -1) * 0.15; wsum += 0.15; }

                score = wsum ? score / wsum : 0;

                if (this.step === 1) {
                    if (Math.abs(score) < 0.15) score = -score * 1.2;
                    score += (Math.random() * 2 - 1) * 0.08;
                } else {
                    score += (Math.random() * 2 - 1) * 0.04;
                }

                score += (window.__fxDeviceSeed - 0.05); // adds a unique subtle user-device variance
                const signal = score >= 0 ? 'BIG' : 'SMALL';
                this.pending = { signal, step: this.step };
                return { signal, step: this.step };
            }

            submitResult(actual) {
                const norm = this._norm(actual);
                if (norm === null) throw new Error('Invalid result');
                if (!this.pending) throw new Error('Predict first');

                const p = this.pending.signal === 'BIG' ? 1 : 0;
                const win = p === norm;

                if (win) {
                    this.winStreak++;
                    this.lossStreak = 0;
                } else {
                    this.lossStreak++;
                    this.winStreak = 0;
                }

                this._prevTwo.push(p);
                if (this._prevTwo.length > 2) this._prevTwo.shift();
                this._prevPred = this.pending.signal;

                if (this.pending.step === 0) this.step = win ? 0 : 1;
                else this.step = 0;

                this.h.push(norm);
                this.pending = null;
                return { win, step: this.step, lossStreak: this.lossStreak };
            }
        }

        let engine = new Wingo30S();
        let lastPredictedPeriod = null;

        async function fetchWinGoHistoryFromAPI() {
            try {
                let response = await fetch('https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json?ts=' + Date.now() + '&r=' + Date.now());
                if (!response.ok) return [];
                let data = await response.json();

                if (data?.data?.list?.length > 0) {
                    window.__winGoLatestRaw = data.data.list[0];
                    return data.data.list.slice().reverse().map(item =>
                        parseInt(item.number) >= 5 ? "BIG" : "SMALL"
                    );
                }
                return [];
            } catch (error) {
                return ["BIG", "SMALL", "BIG", "BIG"];
            }
        }

        function deriveNumberFromPeriod(periodStr, predictedBS) {
            let hash = 0;
            for (let i = 0; i < periodStr.length; i++) {
                hash = ((hash << 5) - hash) + periodStr.charCodeAt(i);
                hash |= 0;
            }
            let base = Math.abs(hash) % 10;

            if (predictedBS === "BIG") {
                return (base < 5) ? base + 5 : base;
            } else {
                return (base >= 5) ? base - 5 : base;
            }
        }

        const PRO_KEY = "DH991";

        const keyInput = document.getElementById('key');
        const unlockBtn = document.getElementById('unlockBtn');
        const loginDiv = document.getElementById('login');

        async function fetchLiveIssue() {

                const response = await fetch('https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json?ts=' + Date.now());
                const data = await response.json();

                let latestIssue = null;

                    } else if (data.data.list && data.data.list.length > 0) {

        async function updateSignal(nextPeriod) {
            currentPeriodNumber = nextPeriod;
            await fetchWinGoHistoryFromAPI();
            const raw = window.__winGoLatestRaw;

            if (raw && lastPredictedPeriod) {
                const actualPeriod = raw.issueNumber || raw.issue;
                const actualResult = parseInt(raw.number) >= 5 ? "BIG" : "SMALL";

                if (String(lastPredictedPeriod) === String(actualPeriod)) {
                    try {
                        engine.submitResult(actualResult);
                    } catch (e) {}
                }
            }

            const pred = engine.predict();
            let predictedBS = pred.signal;

            let luckyNum = deriveNumberFromPeriod(nextPeriod, predictedBS);
            if (luckyNum >= 5) predictedBS = "BIG";
            else predictedBS = "SMALL";

            const ballImgUrl = BALL_IMAGES[luckyNum] || '';

            bsDisplay.innerHTML = `${predictedBS} <br><img src="${ballImgUrl}" class="ball-icon" alt="${luckyNum}">`;

            lastPredictedPeriod = nextPeriod;

        async function checkAndUpdatePeriod() {
            const nextPeriod = await fetchLiveIssue();
            if (nextPeriod) {
                const now = Math.floor(Date.now() / 1000);
                let timeLeft = 30 - (now % 30);

                if (nextPeriod !== lastFetchedPeriod) {
                    lastFetchedPeriod = nextPeriod;
                    await updateSignal(nextPeriod);
                }

                timerPill.textContent = `${currentPeriodNumber} [${timeLeft}]`;

                if (timeLeft <= 5 && timeLeft > 0) {
                    timerPill.style.color = '#ff1744';

        async function startGame() {
            engine = new Wingo30S();
            const historyArr = await fetchWinGoHistoryFromAPI();
            engine.h = historyArr.map(v => v === 'BIG' ? 1 : 0);
            lastPredictedPeriod = null;

            const initialPeriod = await fetchLiveIssue();
            if (initialPeriod) {
                lastFetchedPeriod = initialPeriod;
                await updateSignal(initialPeriod);
            } else {
                currentPeriodNumber = "107228";
                await updateSignal(currentPeriodNumber);
            }

            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(checkAndUpdatePeriod, 1000);
        }

        /* DRAG ENGINE */
        (function() {
            const core = document.getElementById('core');
            if (!core) return;

            let shield = document.getElementById('dragShield');
            if (!shield) {
                shield = document.createElement('div');
                shield.id = 'dragShield';
                document.body.appendChild(shield);
            }

            const SUPPORTS_TRANSLATE = !!(window.CSS && CSS.supports && CSS.supports('translate', '0px 0px'));

            let dragging = false, pointerId = null, startX = 0, startY = 0, baseX = 0, baseY = 0, curX = 0, curY = 0;
            let minX = -1e9, maxX = 1e9, minY = -1e9, maxY = 1e9, raf = null, leftTopMode = false;

            function paint() {
                raf = null;
                if (leftTopMode) {
                    core.style.left = curX + 'px';
                    core.style.top = curY + 'px';
                } else {
                    core.style.translate = curX + 'px ' + curY + 'px';
                }
            }

            function queuePaint() {
                if (raf === null) raf = requestAnimationFrame(paint);
            }

            function onDown(e) {
                if (dragging) return;
                if (e.pointerType === 'mouse' && e.button !== 0) return;
                if (e.target && e.target.closest && e.target.closest('input, button, textarea, select, .inp, .btn, .telegram-btn')) return;

                dragging = true;
                pointerId = e.pointerId;

                const rect = core.getBoundingClientRect();
                const pad = 8;

                if (SUPPORTS_TRANSLATE) {
                    const baseLeft = rect.left - curX;
                    const baseTop = rect.top - curY;
                    minX = pad - baseLeft;
                    maxX = window.innerWidth - baseLeft - rect.width - pad;
                    minY = pad - baseTop;
                    maxY = window.innerHeight - baseTop - rect.height - pad;
                } else {
                    leftTopMode = true;
                    core.style.right = 'auto';
                    core.style.bottom = 'auto';
                    core.style.left = rect.left + 'px';
                    core.style.top = rect.top + 'px';
                    curX = rect.left;
                    curY = rect.top;
                    minX = pad;
                    maxX = window.innerWidth - rect.width - pad;
                    minY = pad;
                    maxY = window.innerHeight - rect.height - pad;
                }

                baseX = curX; baseY = curY;
                startX = e.clientX; startY = e.clientY;

                core.classList.add('dragging');
                shield.classList.add('on');
                core.style.willChange = 'translate';

                if (core.setPointerCapture) {
                    try { core.setPointerCapture(e.pointerId); } catch (err) {}
                }
                e.preventDefault();
            }

            (function() {
                function onMove(e) {
                    if (!dragging || e.pointerId !== pointerId) return;
                    let nx = baseX + (e.clientX - startX);
                    let ny = baseY + (e.clientY - startY);
                    if (nx < minX) nx = minX;
                    else if (nx > maxX) nx = maxX;
                    if (ny < minY) ny = minY;
                    else if (ny > maxY) ny = maxY;
                    curX = nx; curY = ny;
                    queuePaint();
                    e.preventDefault();
                }

                function onUp(e) {
                    if (!dragging) return;
                    if (e && e.pointerId !== undefined && e.pointerId !== pointerId) return;
                    dragging = false;
                    pointerId = null;
                    core.classList.remove('dragging');
                    shield.classList.remove('on');
                    if (raf !== null) {
                        cancelAnimationFrame(raf);
                        raf = null;
                    }
                    paint();
                    setTimeout(function() {
                        if (!dragging) core.style.willChange = '';
                    }, 400);
                }

                if (window.PointerEvent) {
                    core.addEventListener('pointerdown', onDown, { passive: false });
                    document.addEventListener('pointermove', onMove, { passive: false });
                    document.addEventListener('pointerup', onUp);
                    document.addEventListener('pointercancel', onUp);
                }
            })();
        })();
